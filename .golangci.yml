version: "2"

run:
  go: "1.26"
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable-all: false
    misspell:
      locale: US
    staticcheck:
      checks:
        - "all"
        - "-SA1019"
        - "-SA1029"
        - "-ST1000"
        - "-ST1003"
        - "-QF*"

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
