version: 2

project_name: possum

before:
  hooks:
    - go mod tidy

builds:
  - id: possum-cli
    main: ./cmd/possum
    binary: possum
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/possum-security/possum-core/pkg/version.Version={{.Version}} -X github.com/possum-security/possum-core/pkg/version.GitCommit={{.Commit}} -X github.com/possum-security/possum-core/pkg/version.BuildDate={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

sboms:
  - artifacts: archive

signs:
  - artifacts: checksum
    args: ["--output-certificate=${certificate}", "--output-signature=${signature}", "${artifact}", "--yes"]

brews:
  - repository:
      owner: possum-security
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://possum.io"
    description: "Developer-First FinSecOps Cloud Security & Waste Scanner"
    license: "Apache-2.0"

dockers:
  - image_templates:
      - "possumsec/possum:{{ .Version }}"
      - "possumsec/possum:latest"
    dockerfile: Dockerfile.goreleaser

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - Merge pull request
      - Merge branch
