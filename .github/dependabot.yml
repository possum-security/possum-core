version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci"

  - package-ecosystem: "gomod"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
