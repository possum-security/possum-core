name: Bug Report
description: Report an issue or bug in possum-core
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run possum with arguments '...'
        2. Scan resource '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Possum Version
      description: Output of `possum version` or commit hash.
      placeholder: v0.1.0 (or commit sha)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Go version, cloud provider details.
      placeholder: e.g. Linux x86_64, AWS us-east-1, Go 1.26
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context / Logs
      description: Add any error output, logs, or other context here.
    validations:
      required: false
