name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
          cache: true

      - name: Verify Module Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run golangci-lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@971e284b6050e8a5849b72094c50ab08da042db8 # v6.1.1
        with:
          version: v1.64.5

      - name: Run Vulnerability Check (govulncheck)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Security Analysis (gosec)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -exclude=G104,G204,G304,G115 ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests with Coverage (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -v -coverprofile=coverage.out -covermode=atomic ./...
          COVERAGE=$(go tool cover -func=coverage.out | awk '/total:/ {print $NF}' | tr -d '%')
          echo "Total Statement Coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" -v min="60.0" 'BEGIN { if (cov < min) { printf "Statement coverage %.1f%% is below threshold %.1f%%\n", cov, min; exit 1 } else { printf "Statement coverage gate passed: %.1f%% >= %.1f%%\n", cov, min } }'

      - name: Run Unit Tests (macOS & Windows)
        if: matrix.os != 'ubuntu-latest'
        run: go test -v ./...

      - name: Build Binary
        shell: bash
        run: |
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXT=".exe"
          fi
          go build -o bin/possum${EXT} ./cmd/possum

      - name: Verify Standalone Execution
        shell: bash
        run: |
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXT=".exe"
          fi
          ./bin/possum${EXT} version
          ./bin/possum${EXT} rules list --service s3
          ./bin/possum${EXT} rules get s3_bucket_level_public_access_block
