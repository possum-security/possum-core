name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.8.1
        ports:
          - 4566:4566
        env:
          SERVICES: s3,iam,ec2
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
          cache: true

      - name: Verify Module Dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Run Vulnerability Check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Security Analysis (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -exclude=G104,G204,G304,G115 ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests with Coverage
        run: |
          go test -v -coverprofile=coverage.out -covermode=atomic ./...
          COVERAGE=$(go tool cover -func=coverage.out | awk '/total:/ {print $NF}' | tr -d '%')
          echo "Total Statement Coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" -v min="60.0" 'BEGIN { if (cov < min) { printf "Statement coverage %.1f%% is below threshold %.1f%%\n", cov, min; exit 1 } else { printf "Statement coverage gate passed: %.1f%% >= %.1f%%\n", cov, min } }'

      - name: Wait for LocalStack
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:4566/_localstack/health | grep -q '"available"'; then
              echo "LocalStack is ready"
              break
            fi
            echo "Waiting for LocalStack..."
            sleep 2
          done

      - name: Run Integration Tests (LocalStack)
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_S3_USE_PATH_STYLE: "true"
        run: go test -v -tags=integration ./tests/integration/...

      - name: Build Binary
        run: go build -o bin/possum ./cmd/possum

      - name: Verify Standalone Execution
        run: |
          ./bin/possum version
          ./bin/possum rules list --service s3
          ./bin/possum rules get s3_bucket_level_public_access_block
